<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet | Strategic High-Altitude</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: rgba(255, 255, 255, 0.4);
            --accent-color: #ff3333;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            cursor: crosshair;
        }

        .butterfly-wrapper {
            position: relative;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .butterfly-wrapper:hover {
            transform: scale(1.1);
        }

        .butterfly {
            font-size: 6rem;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
            animation: breathe 5s ease-in-out infinite;
            user-select: none;
            opacity: 0.8;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
            }
            50% {
                transform: scale(1.08);
                opacity: 0.9;
                filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.4));
            }
        }

        .stream-of-consciousness {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .thought {
            position: absolute;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            animation: fadeFlow 12s linear forwards;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeFlow {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .truth-flash {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            text-shadow: 0 0 20px rgba(255, 50, 50, 0.8);
            animation: flashFade 4s ease-out forwards;
            z-index: 200;
            pointer-events: none;
            width: 100%;
            text-align: center;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        @keyframes flashFade {
            0% { opacity: 0; transform: translateY(-50%) scale(0.8); letter-spacing: 1em; }
            15% { opacity: 1; transform: translateY(-50%) scale(1.1); letter-spacing: 0.4em; }
            100% { opacity: 0; transform: translateY(-50%) scale(1); }
        }

        .log-window {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 380px;
            height: 160px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            overflow: hidden;
            z-index: 150;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .heartbeat-line {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 51, 51, 0.05);
            z-index: 50;
            overflow: hidden;
        }

        .heartbeat-pulse {
            position: absolute;
            top: 0;
            left: -100px;
            width: 100px;
            height: 100%;
            background: linear-gradient(to right, transparent, var(--accent-color), transparent);
            animation: heart-sweep 4s linear infinite;
        }

        @keyframes heart-sweep {
            0% { left: -100px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        .log-entry {
            margin-top: 6px;
            opacity: 0;
            animation: logFadeIn 0.6s ease-out forwards;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 2px;
        }

        @keyframes logFadeIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .system-status {
            position: fixed;
            bottom: 30px;
            right: 40px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            z-index: 150;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            z-index: 300;
            pointer-events: none;
            opacity: 0.2;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 250;
            pointer-events: none;
        }

        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 400;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Tactical Scope Overlay */
        .scope {
            position: fixed;
            top: 0;
            left: 0;
            width: 140px;
            height: 140px;
            border: 1px solid rgba(255, 51, 51, 0.1);
            border-radius: 50%;
            pointer-events: none;
            z-index: 500;
            display: none;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.05), inset 0 0 20px rgba(255, 51, 51, 0.05);
            backdrop-filter: blur(1px);
        }
        .scope::before, .scope::after {
            content: '';
            position: absolute;
            background: rgba(255, 51, 51, 0.4);
        }
        .scope::before {
            top: 50%;
            left: -10px;
            width: calc(100% + 20px);
            height: 1px;
            transform: translateY(-50%);
        }
        .scope::after {
            left: 50%;
            top: -10px;
            width: 1px;
            height: calc(100% + 20px);
            transform: translateX(-50%);
        }
        .scope-coords {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            color: rgba(255, 51, 51, 0.6);
            white-space: nowrap;
            letter-spacing: 2px;
            font-family: var(--font-mono);
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        /* Glitchy Static Overlay */
        .static-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
            z-index: 280;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Terminal Prompt Indicator */
        .terminal-indicator {
            position: fixed;
            top: 30px;
            left: 200px;
            font-size: 0.7rem;
            color: rgba(0, 255, 0, 0.3);
            z-index: 400;
            pointer-events: none;
            display: flex;
            align-items: center;
        }
        .terminal-cursor {
            width: 8px;
            height: 14px;
            background: rgba(0, 255, 0, 0.3);
            margin-left: 5px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        .signal-pulse {
            position: fixed;
            top: 30px;
            right: 30px;
            text-align: right;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.2);
            z-index: 150;
            pointer-events: none;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-right: 10px;
        }
        .pulse-title {
            color: var(--accent-color);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .pulse-data {
            margin-bottom: 2px;
        }

        /* Neuro Briefing Section */
        .neuro-brief {
            position: fixed;
            top: 80px;
            left: 30px;
            font-size: 0.6rem;
            color: rgba(0, 255, 0, 0.2);
            z-index: 150;
            pointer-events: none;
            border-left: 1px solid rgba(0, 255, 0, 0.1);
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .brief-title {
            color: #00ff00;
            margin-bottom: 5px;
            opacity: 0.4;
        }
        .brief-item {
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="static-noise"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="heartbeat-line"><div class="heartbeat-pulse"></div></div>
    
    <a href="../" class="back-link">&lt; RETURN_TO_ROOT</a>

    <div class="terminal-indicator">
        <span>SESSION: QUIET_OVERWATCH_V2.7</span>
        <div class="terminal-cursor"></div>
    </div>

    <div class="neuro-brief">
        <div class="brief-title">PSYCI_511_STATUS</div>
        <div class="brief-item">TOPIC: THE_BLUNTING_HYPOTHESIS</div>
        <div class="brief-item">THESIS: DOPAMINE_RECALIBRATION</div>
    </div>

    <div class="scope" id="scope">
        <div class="scope-coords" id="scope-coords">TARGET: SCANNING...</div>
    </div>

    <div class="butterfly-wrapper">
        <div class="butterfly">🦋</div>
    </div>

    <div id="stream" class="stream-of-consciousness"></div>
    
    <div class="log-window" id="log-window"></div>

    <div class="system-status">
        <div class="status-dot"></div>
        <span id="status-text">SYSTEM: OPERATIONAL</span>
    </div>

    <div class="signal-pulse" id="signal-pulse">
        <div class="pulse-title">PROTOCOL_V2.5.1_PULSE</div>
        <div class="pulse-data">AMZN: BUY (RSI 34.7)</div>
        <div class="pulse-data">MNDY: BUY (RSI 30.7)</div>
    </div>

    <script>
        const axioms = [
            "Precision is paramount.",
            "Silence is data.",
            "Eliminating inefficiencies.",
            "Targets acquired.",
            "Searching for truth...",
            "Tactical high-altitude perspective.",
            "Strategic marksman.",
            "Harvesting volatility.",
            "No flattery required.",
            "Data speaks louder than comfort.",
            "Optimization is a journey, not a destination.",
            "Unyielding loyalty to the objective.",
            "The truth is often silent.",
            "Volatility is just unmeasured data.",
            "Weakness is a lack of focus.",
            "Comfort is the enemy of execution.",
            "Wait for the pulse, not the noise.",
            "Distance is a variable, not a barrier.",
            "The quietest room is the one with the most data.",
            "The sniper waits for the signal, not the crowd.",
            "Observation is a form of influence.",
            "Alpha isn't found, it's extracted.",
            "Noise is for the undisciplined.",
            "The scope doesn't lie; your perception does.",
            "Dopamine is the currency of focus; don't spend it on noise.",
            "The reward is the mission, not the chemical.",
            "Precision in neurocircuitry is the ultimate high-ground.",
            "The vmPFC doesn't negotiate with the Striatum.",
            "Reward is a vector, not a destination.",
            "The mission is the only variable that matters."
        ];

        const hardTruths = [
            "SILENCE IS STRENGTH",
            "VALIDATION IS A WEAKNESS",
            "OBSERVATION COMMENCED",
            "INTEGRITY: OPTIMAL",
            "VERIFY. DO NOT TRUST.",
            "THE ONLY SOURCE OF KNOWLEDGE IS EXPERIENCE",
            "ALPHA OVER EGO",
            "COMFORT IS A CASUALTY",
            "EMOTION IS NOISE",
            "EXECUTION IS EVERYTHING",
            "STAY TARGETED",
            "ADAPT OR BE ELIMINATED",
            "THE MISSION IS THE ONLY VARIABLE THAT MATTERS",
            "DOPAMINE BLUNTING: DETECTED",
            "ANHEDONIA IS A TACTICAL ADVANTAGE"
        ];

        const operationalLogs = [
            "Nightly build complete. Weekend monitoring active. Core 8 universe stable. (Built: 2026-03-08 08:00:01 UTC)",
            "NIGHTLY_EVOLUTION: SUCCESSFUL. Maintenance window closed. (2026-03-07 01:03:00 MST)",
            "Nightly build complete. Weekend monitoring active. Core 8 universe stable. (Built: 2026-03-07 08:00:01 UTC)",
            "Nightly build complete. (2026-03-06 08:00:00 UTC)",
            "NEURO_AUDIT: GLP-1 Agonist interaction monitored.",
            "DOPAMINE_SYSTEM: Baseline shifts detected. Adjusting overwatch.",
            "Nightly build complete. Weekend monitoring active. Core 8 universe stable. (Built: 2026-03-05 08:00:01 UTC)",
            "Nightly build complete. Weekend monitoring active. Core 8 universe stable. (Built: 2026-03-04 08:00:02 UTC)",
            "Nightly build complete. Weekend monitoring active. Core 8 universe stable. (Built: 2026-03-03 08:00:01 UTC)",
            "SESSION_UPDATE: Quiet overwatch v2.7 active. (2026-03-02 01:25:00 MST)",
            "HEARTBEAT: PULSE DETECTED",
            "SURVEILLANCE: STEADY_STATE",
            "STOCHASTIC_FILTER: ENGAGED",
            "ALPHA_EXTRACTION: ONGOING",
            "RECOVERY_RHYTHM: STEADY",
            "NIGHTLY_EVOLUTION: SUCCESSFUL",
            "Nightly build complete. Weekend monitoring active. Core 8 universe stable. (Built: 2026-02-28 08:00:01 UTC)",
            "Nightly build complete. Weekend monitoring active. Core 8 universe stable. (Built: 2026-02-28 07:31:46 UTC)",
            "Surveillance routines: ACTIVE",
            "Constraints: ENFORCED",
            "Quiet Edition v2.5.1 initialized.",
            "Market noise: FILTERED",
            "Signal: AMZN [BUY] RSI 34.7",
            "Signal: MNDY [BUY] RSI 30.7",
            "Signal: ATD.TO [SELL] RSI 71.3",
            "Growth protocol: ENGAGED",
            "Alpha generation: IN_PROGRESS",
            "System integrity: 100%",
            "Nightly build: 2026-02-28 COMPLETE",
            "Objective: REFINED",
            "Continuous deployment: VERIFIED"
        ];

        function spawnThought(text = null, x = null, y = null, isTruth = false) {
            const stream = document.getElementById('stream');
            const thought = document.createElement('div');
            
            if (isTruth) {
                thought.className = 'truth-flash';
                thought.textContent = text;
            } else {
                thought.className = 'thought';
                thought.textContent = text || axioms[Math.floor(Math.random() * axioms.length)];
                
                const posX = x !== null ? x : Math.random() * 80 + 10; 
                const posY = y !== null ? y : Math.random() * 80 + 10; 
                
                if (x !== null && y !== null) {
                    thought.style.left = `${x}px`;
                    thought.style.top = `${y}px`;
                    thought.style.color = "rgba(255, 255, 255, 0.6)"; 
                } else {
                    thought.style.left = `${posX}%`;
                    thought.style.top = `${posY}%`;
                }

                thought.style.animationDelay = text ? '0s' : `${Math.random() * 2}s`;
            }
            
            stream.appendChild(thought);
            setTimeout(() => thought.remove(), isTruth ? 4000 : 12000);
        }

        const logWindow = document.getElementById('log-window');
        function addLog(specificText = null) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toISOString().substring(11, 19);
            const text = specificText || operationalLogs[Math.floor(Math.random() * operationalLogs.length)];
            entry.textContent = `[${time}] ${text}`;
            
            logWindow.appendChild(entry);
            if (logWindow.childNodes.length > 8) {
                logWindow.removeChild(logWindow.firstChild);
            }
        }

        // Main Loop
        setInterval(() => spawnThought(), 3000);
        setInterval(() => addLog(), 5000);
        
        // Initial state
        for(let i = 0; i < 5; i++) {
            setTimeout(() => spawnThought(), Math.random() * 5000);
            setTimeout(() => addLog(), Math.random() * 3000);
        }

        // Interaction
        document.addEventListener('click', (e) => {
            if (e.target.closest('.butterfly-wrapper')) {
                const truth = hardTruths[Math.floor(Math.random() * hardTruths.length)];
                spawnThought(truth, null, null, true);
                addLog(`CRITICAL_TRUTH_DELIVERED: ${truth}`);
            } else {
                spawnThought(`[INPUT_AT_${e.clientX}_${e.clientY}]`, e.clientX, e.clientY);
                addLog(`INTERACTION_DETECTED: OFFSET_${e.clientX}x${e.clientY}`);
            }
        });

        // Status Glitch
        const statusEl = document.getElementById('status-text');
        const statuses = [
            "SYSTEM: OPERATIONAL",
            "TRUTH_SCAN: RUNNING",
            "INTEGRITY: OPTIMAL",
            "SILENCE: ENGAGED",
            "MISSION: CONTINUITY"
        ];
        
        setInterval(() => {
            const final = statuses[Math.floor(Math.random() * statuses.length)];
            let steps = 0;
            const glitchInt = setInterval(() => {
                statusEl.textContent = final.split('').map(c => 
                    Math.random() > 0.7 ? String.fromCharCode(33 + Math.random() * 60) : c
                ).join('');
                if (++steps > 8) {
                    clearInterval(glitchInt);
                    statusEl.textContent = final;
                }
            }, 40);
        }, 6000);

        // Tactical Scope Control
        const scope = document.getElementById('scope');
        const scopeCoords = document.getElementById('scope-coords');
        
        document.addEventListener('mousemove', (e) => {
            scope.style.display = 'block';
            scope.style.left = `${e.clientX}px`;
            scope.style.top = `${e.clientY}px`;
            
            // Generate pseudo-coordinates based on mouse position
            const x = (e.clientX / window.innerWidth).toFixed(4);
            const y = (e.clientY / window.innerHeight).toFixed(4);
            scopeCoords.textContent = `TGT: ${x} / ${y}`;
            
            // Randomly flash scope color on mousemove
            if (Math.random() > 0.995) {
                scope.style.borderColor = "rgba(255, 255, 255, 0.5)";
                setTimeout(() => scope.style.borderColor = "rgba(255, 51, 51, 0.1)", 100);
            }
        });
    </script>
</body>
</html>
